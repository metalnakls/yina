# Publishes the Sparkle appcast and update archive to GitHub Pages.
#
# A tag matching `v*` triggers a release build. The signed update archive and a
# generated appcast.xml are published to the `gh-pages` branch, which serves the
# feed that SUFeedURL points at.
#
# The EdDSA private key must be available as the SPARKLE_PRIVATE_KEY secret. It is
# imported into the runner keychain only for the signing step and is never written
# to the repository or to the published Pages output.
name: Appcast

permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./other/download_libs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Sparkle signing key
        run: |
          set -euo pipefail
          test -n "${SPARKLE_PRIVATE_KEY:-}" || {
            echo "SPARKLE_PRIVATE_KEY secret is not set; cannot sign updates." >&2
            exit 1
          }
          KEY_FILE="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys -f "$KEY_FILE"
          rm -f "$KEY_FILE"

      - name: Build release
        run: |
          set -euo pipefail
          xcodebuild \
            -project yina.xcodeproj \
            -scheme yina \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/yina-derived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            YINA_VERSION="$(cat VERSION)" \
            build
          ./other/modernize_arm64_bundle.sh "$RUNNER_TEMP/yina-derived/Build/Products/Release/yina.app"

      - name: Sign update archive
        run: |
          set -euo pipefail
          SPARKLE_BIN="$PWD/SourcePackages/artifacts/sparkle/Sparkle/bin"
          VERSION="$(cat VERSION)"
          ZIP="$RUNNER_TEMP/yina-$VERSION.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/yina-derived/Build/Products/Release/yina.app" "$ZIP"
          "$SPARKLE_BIN/sign_update" "$ZIP" | tee "$RUNNER_TEMP/signature.txt"

      - name: Publish appcast
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          ZIP="$RUNNER_TEMP/yina-$VERSION.zip"
          URL="https://github.com/swagless/yina/releases/download/v$VERSION/yina-$VERSION.zip"
          SIGNATURE="$(tail -1 "$RUNNER_TEMP/signature.txt")"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true

          rm -rf .pages-publish
          git worktree add .pages-publish gh-pages 2>/dev/null || {
            git worktree add --detach .pages-publish
            git -C .pages-publish checkout --orphan gh-pages
            git -C .pages-publish rm -rf . >/dev/null 2>&1 || true
          }

          mkdir -p .pages-publish/releases
          cp "$ZIP" ".pages-publish/releases/yina-$VERSION.zip"

          # The appcast is written by a helper script so the XML heredoc never
          # has to live inside this YAML block scalar.
          ./other/write_appcast.sh \
            .pages-publish/appcast.xml \
            "$URL" "$VERSION" "$SIGNATURE" "$ZIP"

          cd .pages-publish
          git add -A
          git commit -m "Publish appcast $VERSION"
          git push origin gh-pages
