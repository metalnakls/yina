[files]
extend-exclude = [
    ".git/",
    "deps/",
    "yina.xcodeproj/",
    "yina/Assets.xcassets/Symbols/**/*.svg",
    "**/*.strings",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    # Git patch index lines contain hexadecimal object IDs, not prose.
    '(?m)^index [0-9a-f]+\.\.[0-9a-f]+(?: [0-7]{6})?$',
    "\\bBig Sur\\b",
    '(firstItem|secondItem|id|destination|headerView)="[0-9A-Za-z]+-[0-9A-Za-z]+-[0-9A-Za-z]+"',
    'apiKey = "[^"]+"',
    "V\\[alue\\]",
    "ba!",
    # Ignore the token declaration in AssrtSubtitle.
    "5IzWrb.*",
]

# Crowdin-generated localization keys embed arbitrary substrings that collide
# with the spell checker (for example "3T9-gp-4UE" and "y68-ot-NOl"). These
# identifiers are keys, not prose, and must never be rewritten.
[default.extend-words]
# typos splits hyphenated keys, so whitelist the fragments themselves.
# typos lowercases before matching, so the fragment is spelled lowercase here.
"ue" = "ue"
"gp" = "gp"
"3T9" = "3T9"
"ot" = "ot"
"y68" = "y68"
"NOl" = "NOl"
"abitrate" = "abitrate"
"splitted" = "splitted"
"writeable" = "writeable"

[default.extend-identifiers]
"caf" = "caf"
# Xcode uses this property in XIBs.
"customObjectInstantitationMethod" = "customObjectInstantitationMethod"
"iy" = "iy"
"reloadSavedYINAfilters" = "reloadSavedYINAfilters"
"tak" = "tak"
"videoParamsMaxCll" = "videoParamsMaxCll"
"CPSProcessSerNum" = "CPSProcessSerNum"
